services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: mc, POSTGRES_PASSWORD: mc, POSTGRES_DB: mc}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U mc"], interval: 5s, retries: 10}
  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://mc:mc@db:5432/mc
      RUN_SCHEDULER: "0"   # scheduling lives in the worker service
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on: {db: {condition: service_healthy}}
  worker:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://mc:mc@db:5432/mc
    command: ["sh", "-c", "alembic upgrade head && python -m app.worker"]
    volumes: ["./data:/app/data"]
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}
